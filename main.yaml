substitutions:
  name: "ascs-multisensor"
  friendly_name: "ASCS Multisensor"
  device_description: "ASCS Multisensor: motion target tracking and enviroment sensor"
  project_name: "ascs.multisensor"
  project_version: "2026.11.02"
  update_interval: 60s

esphome:
  min_version: 2026.08.0
  includes:
    - radar/zone_writer.h
    - radar/web_scope.h
  on_boot:
    - priority: 300
      then:
        - lambda: ascs_radar::register_editor_routes();
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
mdns:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]

http_request:
  id: http_request_component

improv_serial:

improv_ble:
  authorizer: none


captive_portal:

web_server:
  port: 80
  version: 3
  local: false
  js_url: ""
  css_url: ""
  js_include: radar/editor.js
  log: false
  ota: false

wifi:
  ap:
    ssid: "ASCS Multisensor Setup"
    password: ""

dashboard_import:
  package_import_url: github://ASCSadmin/ascs-multisensor/main.yaml

update:
  - platform: http_request
    id: firmware_update_http
    name: "${friendly_name} Firmware"
    source: https://ASCSadmin.github.io/ascs-multisensor/firmware/manifest.json
    update_interval: 1h

uart:
  id: uart_ld2450
  tx_pin:
    number: GPIO17
  rx_pin:
    number: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

i2c:
  id: i2c_bus_main
  sda: GPIO21
  scl: GPIO22
  scan: true

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      id: has_target_presence
      name: "Präsenz"
    has_moving_target:
      id: has_moving_target_presence
      name: "Bewegtes Ziel"
    has_still_target:
      id: has_still_target_presence
      name: "Stehendes Ziel"

number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      id: presence_timeout_number
      name: "Auszeit"
    zone_1:
      x1:
        id: zone_1_x1_number
        name: "Zone-1 X1"
      y1:
        id: zone_1_y1_number
        name: "Zone-1 Y1"
      x2:
        id: zone_1_x2_number
        name: "Zone-1 X2"
      y2:
        id: zone_1_y2_number
        name: "Zone-1 Y2"
    zone_2:
      x1:
        id: zone_2_x1_number
        name: "Zone-2 X1"
      y1:
        id: zone_2_y1_number
        name: "Zone-2 Y1"
      x2:
        id: zone_2_x2_number
        name: "Zone-2 X2"
      y2:
        id: zone_2_y2_number
        name: "Zone-2 Y2"
    zone_3:
      x1:
        id: zone_3_x1_number
        name: "Zone-3 X1"
      y1:
        id: zone_3_y1_number
        name: "Zone-3 Y1"
      x2:
        id: zone_3_x2_number
        name: "Zone-3 X2"
      y2:
        id: zone_3_y2_number
        name: "Zone-3 Y2"
        on_value:
          - lambda: ascs_radar::zone_writer.saw_readback();

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    multi_target:
      id: multi_target_switch
      name: "Mehrfache Zielerfassung"

select:
  - platform: ld2450
    ld2450_id: ld2450_radar
    baud_rate:
      id: ld2450_baud_rate_select
      name: "Baud rate"
    zone_type:
      id: ld2450_zone_type_select
      name: "Zonen Typ"

button:
  - platform: ld2450
    ld2450_id: ld2450_radar
    factory_reset:
      id: ld2450_factory_reset_button
      name: "Radar Factory Reset"
      entity_category: "config"
    restart:
      id: ld2450_restart_button
      name: "Radar Neustart"
      entity_category: "config"
  - platform: factory_reset
    name: Sensor Werkseinstellungen (ACHTUNG!)
    id: button_factory_reset_1
    entity_category: diagnostic
  - platform: restart
    name: Sensor Neustart
    id: button_restart_1
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: ${update_interval}

  - platform: am2320
    temperature:
      id: am2320_temperature
      name: "Temperatur"
    humidity:
      id: am2320_humidity
      name: "Luftfeuchtigkeit"
    update_interval: ${update_interval}

  - platform: bh1750
    id: bh1750_illuminance
    name: "Helligkeit"
    address: 0x23
    update_interval: ${update_interval}

  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      id: ld2450_target_count
      name: "Ziele Anzahl"
    still_target_count:
      id: ld2450_still_target_count
      name: "Stehende Ziele Anzahl"
    moving_target_count:
      id: ld2450_moving_target_count
      name: "Bewegte Ziele Anzahl"
    target_1:
      x:
        id: target_1_x
        name: "Ziel-1 X"
      y:
        id: target_1_y
        name: "Ziel-1 Y"
      speed:
        id: target_1_speed
        name: "Ziel-1 Geschwindigkeit"
      angle:
        id: target_1_angle
        name: "Ziel-1 Winkel"
      distance:
        id: target_1_distance
        name: "Ziel-1 Abstand"
      resolution:
        id: target_1_resolution
        name: "Ziel-1 Auflösung"
    target_2:
      x:
        id: target_2_x
        name: "Ziel-2 X"
      y:
        id: target_2_y
        name: "Ziel-2 Y"
      speed:
        id: target_2_speed
        name: "Ziel-2 Geschwindigkeit"
      angle:
        id: target_2_angle
        name: "Ziel-2 Winkel"
      distance:
        id: target_2_distance
        name: "Ziel-2 Abstand"
      resolution:
        id: target_2_resolution
        name: "Ziel-2 Auflösung"
    target_3:
      x:
        id: target_3_x
        name: "Ziel-3 X"
      y:
        id: target_3_y
        name: "Ziel-3 Y"
      speed:
        id: target_3_speed
        name: "Ziel-3 Geschwindigkeit"
      angle:
        id: target_3_angle
        name: "Ziel-3 Winkel"
      distance:
        id: target_3_distance
        name: "Ziel-3 Abstand"
      resolution:
        id: target_3_resolution
        name: "Ziel-3 Auflösung"
    zone_1:
      target_count:
        id: zone_1_target_count
        name: "Zone-1 Alle Ziele"
      still_target_count:
        id: zone_1_still_target_count
        name: "Zone-1 Stehende Ziele"
      moving_target_count:
        id: zone_1_moving_target_count
        name: "Zone-1 Bewegte Ziele"
    zone_2:
      target_count:
        id: zone_2_target_count
        name: "Zone-2 Alle Ziele"
      still_target_count:
        id: zone_2_still_target_count
        name: "Zone-2 Stehende Ziele"
      moving_target_count:
        id: zone_2_moving_target_count
        name: "Zone-2 Bewegte Ziele"
    zone_3:
      target_count:
        id: zone_3_target_count
        name: "Zone-3 Alle Ziele"
      still_target_count:
        id: zone_3_still_target_count
        name: "Zone-3 Stehende Ziele"
      moving_target_count:
        id: zone_3_moving_target_count
        name: "Zone-3 Bewegte Ziele"

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      id: ld2450_firmware_version
      name: "LD2450 Firmware"
    target_1:
      direction:
        id: target_1_direction
        name: "Ziel-1 Richtung"
    target_2:
      direction:
        id: target_2_direction
        name: "Ziel-2 Richtung"
    target_3:
      direction:
        id: target_3_direction
        name: "Ziel-3 Richtung"

# One request per save. The editor checks the original settings before writing
# and waits for the LD2450 to report its stored values before showing success.
text:
  - platform: template
    id: ascs_zone_request
    name: "ASCS Zonenauftrag"
    entity_category: config
    disabled_by_default: true
    mode: text
    max_length: 180
    set_action:
      - lambda: |-
          ascs_radar::zone_writer.begin(x, millis(),
            [] { id(ld2450_radar).query_zone_info(); },
            [](const std::string &reply) { id(ascs_zone_request).publish_state(reply); });

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!ascs_radar::zone_writer.active()) return;
          auto read = [](ascs_radar::Settings &out) {
            const auto mode = id(ld2450_zone_type_select).active_index();
            if (!mode.has_value()) return false;
            out[0] = *mode;
            esphome::number::Number *coords[] = {
              id(zone_1_x1_number), id(zone_1_y1_number), id(zone_1_x2_number), id(zone_1_y2_number),
              id(zone_2_x1_number), id(zone_2_y1_number), id(zone_2_x2_number), id(zone_2_y2_number),
              id(zone_3_x1_number), id(zone_3_y1_number), id(zone_3_x2_number), id(zone_3_y2_number)
            };
            for (size_t i = 0; i < 12; ++i) {
              if (!coords[i]->has_state() || !std::isfinite(coords[i]->state)) return false;
              out[i + 1] = static_cast<int>(coords[i]->state);
            }
            return true;
          };
          ascs_radar::zone_writer.step(millis(), read,
            [](const ascs_radar::Settings &v) {
              id(ld2450_radar).set_radar_zone(v[0], v[1], v[2], v[3], v[4], v[5], v[6],
                                              v[7], v[8], v[9], v[10], v[11], v[12]);
            },
            [](const std::string &reply) { id(ascs_zone_request).publish_state(reply); });
